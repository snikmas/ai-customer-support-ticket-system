# Docker's DNS updates when the API container is recreated. Resolve the
# service name periodically instead of keeping its startup IP indefinitely.
upstream resolveai_api {
    zone resolveai_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser API calls same-origin. This avoids host/browser proxy
    # settings and forwards only the API prefix across the Compose network.
    location /api/ {
        # Allow a 5 MiB attachment plus multipart headers. FastAPI validates
        # the actual file size and count.
        client_max_body_size 6m;
        proxy_pass http://resolveai_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Single-page application fallback: real files are served directly;
        # anything else (e.g. /tickets/123 client-side routes) returns
        # index.html so React Router can resolve it in the browser.
        try_files $uri $uri/ /index.html;
    }
}
