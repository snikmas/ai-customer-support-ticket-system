server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Single-page application fallback: real files are served directly;
        # anything else (e.g. /tickets/123 client-side routes) returns
        # index.html so React Router can resolve it in the browser.
        try_files $uri $uri/ /index.html;
    }
}
