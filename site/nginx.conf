server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser API calls same-origin. This avoids host/browser proxy
    # settings and forwards only the API prefix across the Compose network.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Single-page application fallback: real files are served directly;
        # anything else (e.g. /tickets/123 client-side routes) returns
        # index.html so React Router can resolve it in the browser.
        try_files $uri $uri/ /index.html;
    }
}
