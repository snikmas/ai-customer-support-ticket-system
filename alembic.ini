# Alembic configuration — database schema migrations.
#
# Why this file exists:
# SQLite let us create/upgrade the schema implicitly at app startup
# (create_db() in src/db/utils.py). PostgreSQL deployments instead use
# explicit, versioned migrations: every schema change is a numbered Python
# file in alembic/versions/ that can be applied ("upgrade") or reverted
# ("downgrade"). This is how production teams change schemas safely.
#
# Only the migration script location lives here. The database URL is NOT in
# this file on purpose: alembic/env.py reads it from the same DATABASE_URL
# environment variable the application uses, so there is exactly one source
# of truth and no credential can be committed here by accident.

[alembic]
script_location = alembic

# Path template used when generating new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
